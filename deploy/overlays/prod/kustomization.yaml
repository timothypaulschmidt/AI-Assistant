# prod: the base plus an HTTPS Ingress at https://ai.fortinetlabs.com
# Apply with:  kubectl apply -k deploy/overlays/prod
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../k8s
  - ingress.yaml

# Prod settings, merged into the assistant's ConfigMap from deploy/k8s/app/config.env. Same as QA:
#   MCP_SERVER_URL  the MCP server in this cluster (its Service name, port 8000)
#   OLLAMA_MODEL    default local model; the page's "Local model" dropdown can switch
configMapGenerator:
  - name: ai-assistant-config
    behavior: merge
    literals:
      - MCP_SERVER_URL=http://mcp-server:8000/mcp
      - OLLAMA_MODEL=qwen3:8b
      # FortiAIGate (model only): the gateway's OpenAI namespace, the model name it publishes,
      # and its lab certificate. Pick the route with the pipeline menu (route "model").
      - FAIG_OLLAMA_BASE_URL=https://llm-gateway.fortiaigate:8080/ai/openai
      - FAIG_OLLAMA_MODEL=ollama-qwen3-8b
      - FAIG_VERIFY_TLS=false
