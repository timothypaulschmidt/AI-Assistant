apiVersion: v1
kind: Service
metadata:
  name: ai-assistant
  labels:
    app.kubernetes.io/name: ai-assistant
spec:
  # NodePort: reachable at http://<VM IP>:30080 from your LAN. There is no
  # login yet, so keep this on the home network (see deploy/README.md).
  type: NodePort
  selector:
    app.kubernetes.io/name: ai-assistant
  ports:
    - name: http
      port: 8000
      targetPort: http
      nodePort: 30080
