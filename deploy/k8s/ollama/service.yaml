apiVersion: v1
kind: Service
metadata:
  name: ollama
  labels:
    app.kubernetes.io/name: ollama
spec:
  # ClusterIP: only reachable from inside the cluster, as http://ollama:11434.
  # Ollama has no login, so it is deliberately not exposed outside.
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ollama
  ports:
    - name: http
      port: 11434
      targetPort: http
