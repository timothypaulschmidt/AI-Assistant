apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  labels:
    app.kubernetes.io/name: ollama
spec:
  replicas: 1
  # One pod owns the model volume, so stop the old pod before starting a new one.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: ollama
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ollama
    spec:
      containers:
        - name: ollama
          # The tag is set in ../kustomization.yaml (images:)
          image: ollama/ollama
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 11434
          env:
            - name: OLLAMA_HOST
              value: "0.0.0.0:11434"
            # Keep a model in memory this long after the last request
            - name: OLLAMA_KEEP_ALIVE
              value: "10m"
          volumeMounts:
            - name: models
              mountPath: /root/.ollama
          # Readiness only, and generous: while every CPU core is busy
          # generating text, a strict probe could time out and either drop
          # the pod from the Service or (liveness) restart it mid-answer.
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: "1"
              memory: 6Gi
            limits:
              # Stops one oversized model from starving the rest of the node.
              # Raise it if you want to try bigger models.
              memory: 24Gi
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: ollama-models
